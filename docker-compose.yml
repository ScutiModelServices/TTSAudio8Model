# Audio8 text-to-speech service: N API replicas behind one nginx address. Each replica runs the model in its own process
# on the GPU (the 0.6B model plus its codec, about 2.5 GB of weights; measure the memory with nvidia-smi); the downloaded
# weights are shared through the models volume, the reference voices through the voices volume.
# Needs an NVIDIA GPU and the NVIDIA Container Toolkit (Docker Desktop on Windows: WSL2 backend with GPU support).
# Start:  docker compose up -d --build          (callers use http://<host>:29322)
# Scale:  SERVICE_REPLICAS=2 docker compose up -d --build, then: docker compose restart tts_audio8_model_lb

name: tts_audio8_model

services:
  tts_audio8_model:
    build: .
    image: tts_audio8_model:latest
    restart: unless-stopped
    environment:
      SERVICE_ADMIN_PASSWORD: ${SERVICE_ADMIN_PASSWORD:-}
      SERVICE_NUM_THREAD: ${SERVICE_NUM_THREAD:-}
      SERVICE_REPLICAS: ${SERVICE_REPLICAS:-1}  # shown read-only on /admin/
    volumes:
      - tts_audio8_model_models:/models
      - tts_audio8_model_voices:/voices
      - tts_audio8_model_data:/data
    deploy:
      replicas: ${SERVICE_REPLICAS:-1}
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29322/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [tts_audio8_model]

  tts_audio8_model_lb:
    container_name: tts_audio8_model_lb
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SERVICE_PORT:-29322}:29322"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      tts_audio8_model:
        condition: service_healthy
    networks:
      tts_audio8_model:
      citadel:
        aliases: [tts_audio8_model_lb]

volumes:
  tts_audio8_model_models:
    name: tts_audio8_model_models
  tts_audio8_model_voices:
    name: tts_audio8_model_voices
  tts_audio8_model_data:
    name: tts_audio8_model_data
networks:
  # Other stacks reach http://tts_audio8_model_lb:29322 by joining this network.
  tts_audio8_model:
    name: tts_audio8_model
  citadel:
    name: citadel_core
    external: true
