[project]
name = "tts_audio8_model"
description = "One HTTP service that runs Audio8 text-to-speech on the CPU for every project"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv==1.2.2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "torch==2.7.1",
    "torchaudio==2.7.1",  # the processor resamples reference clips with it
    "transformers>=4.57.0,<5",  # the range upstream's requirements.txt names
    "huggingface-hub",
    "numpy>=1.26",
    "soundfile>=0.12",  # the processor reads reference clips with it
    "safetensors>=0.4",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.40"]

[tool.uv]
package = false  # runs from src/, only the dependencies are installed

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true  # runs from src/, installs only the dependencies

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
